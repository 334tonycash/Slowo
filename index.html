<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=3, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Rosyjski</title>
<style>
/* Rosyjski 2.0 – interfejs według „Give Good Mobile” (J. Natoli) i „Designing Mobile Apps” (J. Cuello, J. Vittone).
   Układ: telefon – pasek u góry (powrót + temat), treść w jednej kolumnie, nawigacja sekcji na dole (strefa kciuka).
   Tablet poziomo – nawigacja jako pasek z lewej (kciuk przy krawędzi), szersza treść, akcje w dolnych rogach.
   Siatka: moduł 8 px, cele dotyku ≥ 48 px, marginesy boczne 16 px (tablet 24 px).
   Kolor: akcent (niebieski) WYŁĄCZNIE dla elementów, które da się stuknąć. Zielony = sukces, bursztynowy = do powtórki/ostrzeżenie, czerwony = błąd/nieodwracalne. */
@font-face{font-family:"PT Serif";src:url(PT_Serif-Web-Regular.ttf);font-weight:400;font-display:swap}
@font-face{font-family:"PT Serif";src:url(PT_Serif-Web-Bold.ttf);font-weight:700;font-display:swap}
@font-face{font-family:"PT Sans";src:url(PT_Sans-Web-Regular.ttf);font-weight:400;font-display:swap}
@font-face{font-family:"PT Sans";src:url(PT_Sans-Web-Bold.ttf);font-weight:700;font-display:swap}

:root{
  /* jasny motyw (domyślny – ciemne tło szybciej męczy wzrok przy czytaniu) */
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#141A26; --muted:#556073; --faint:#687083; --line:#DCE1E9;
  --accent:#2152B8; --accent-press:#183F90; --accent-soft:#E5EDFC; --on-accent:#FFFFFF;
  --ok:#1C7A4A; --ok-soft:#E1F3E9; --on-ok:#FFFFFF; --on-bad:#FFFFFF; --warn:#8A5800; --warn-soft:#FFF1CF; --bad:#B42318; --bad-soft:#FDE6E3;
  --inverse:#1E2533; --on-inverse:#F3F5F8; --scrim:rgba(14,18,28,.45);
  --shadow:0 1px 2px rgba(20,26,38,.06),0 8px 24px -12px rgba(20,26,38,.18);
  --serif:"PT Serif","Noto Serif",Georgia,serif;
  --sans:"PT Sans",Roboto,"Segoe UI",system-ui,sans-serif;
  /* siatka */
  --s1:4px; --s2:8px; --s3:16px; --s4:24px; --s5:32px; --s6:48px;
  --gutter:16px; --tap:48px; --radius:12px; --nav-h:64px; --bar-h:56px;
  /* rozmiar tekstu (Ustawienia → Rozmiar tekstu) × odległość od oczu (tablet) */
  --ts:1; --tb:1;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1218; --surface:#191E27; --surface-2:#141820; --ink:#E9ECF1; --muted:#A1AABA; --faint:#7D8697; --line:#2B323F;
  --accent:#8DB0FF; --accent-press:#B3CBFF; --accent-soft:#1E2B48; --on-accent:#0F1218;
  --ok:#6FCF9A; --ok-soft:#14301F; --on-ok:#0F1218; --on-bad:#0F1218; --warn:#EDBE55; --warn-soft:#382B0D; --bad:#FF8E84; --bad-soft:#3D1B18;
  --inverse:#E9ECF1; --on-inverse:#141A26; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -12px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1218; --surface:#191E27; --surface-2:#141820; --ink:#E9ECF1; --muted:#A1AABA; --faint:#7D8697; --line:#2B323F;
  --accent:#8DB0FF; --accent-press:#B3CBFF; --accent-soft:#1E2B48; --on-accent:#0F1218;
  --ok:#6FCF9A; --ok-soft:#14301F; --on-ok:#0F1218; --on-bad:#0F1218; --warn:#EDBE55; --warn-soft:#382B0D; --bad:#FF8E84; --bad-soft:#3D1B18;
  --inverse:#E9ECF1; --on-inverse:#141A26; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -12px rgba(0,0,0,.6);
  color-scheme:dark}

@media (min-width:768px){:root{--tb:1.1;--gutter:24px}}

*{box-sizing:border-box}
html{font-size:calc(16px * var(--ts) * var(--tb));-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1.125rem;line-height:1.5;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
.wrap{width:100%;max-width:46rem;margin:0 auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:var(--s2)}
.ic{width:24px;height:24px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Przyciski: ten sam kształt dla tej samej roli ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--tap);padding:0 var(--s3);border-radius:var(--radius);border:1.5px solid var(--line);background:var(--surface);color:var(--accent);font-size:1rem;font-weight:700;cursor:pointer;text-align:center;line-height:1.15;transition:background .12s,transform .08s}
.btn:active{background:var(--accent-soft);transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:active{background:var(--accent-press);border-color:var(--accent-press)}
.btn.text{border-color:transparent;background:transparent;padding:0 var(--s2)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.btn.okb{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.btn.warnb{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.btn.small{min-height:40px;font-size:.9375rem;padding:0 12px;position:relative}
.btn.small::after{content:"";position:absolute;inset:-4px 0}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.block{width:100%}

/* Chipy = filtry treści (wyglądają inaczej niż zakładki nawigacji i niż przełączniki opcji) */
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--accent);font-size:1rem;cursor:pointer}
.chip::after{content:"";position:absolute;inset:-4px 0}
.chip .n{color:var(--faint);font-size:.875rem;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.8}
.chip:active{transform:scale(.97)}

/* Przełącznik segmentowy = wybór jednej opcji */
.seg{display:inline-flex;padding:3px;gap:3px;border-radius:calc(var(--radius) + 3px);background:var(--surface-2);border:1px solid var(--line);max-width:100%}
.seg button{flex:1 1 0;min-width:0;min-height:44px;padding:4px 10px;border:0;border-radius:var(--radius);background:transparent;color:var(--muted);font-size:1rem;line-height:1.2;cursor:pointer;white-space:normal;overflow-wrap:anywhere}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--accent)}
.seg.full{display:flex;width:100%}

/* ---------- Ekran tematów ---------- */
.homehead{padding-top:calc(var(--s4) + env(safe-area-inset-top,0px));padding-bottom:var(--s3)}
.apptitle{font-family:var(--serif);font-weight:700;font-size:2.25rem;letter-spacing:-.01em}
.lede{color:var(--muted);font-size:1.0625rem;margin-top:var(--s1)}
.topiclist{list-style:none;margin:0;padding:0 0 calc(var(--s5) + env(safe-area-inset-bottom,0px));display:grid;gap:var(--s3)}
@media (min-width:768px){.topiclist{grid-template-columns:repeat(auto-fill,minmax(min(100%,22rem),1fr))}}
.topic{width:100%;display:flex;align-items:center;gap:var(--s3);text-align:left;padding:var(--s3);min-height:88px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer}
.topic:active{background:var(--accent-soft)}
.topic .tnum{font-family:var(--serif);font-weight:700;font-size:1.75rem;color:var(--muted);min-width:1.5ch;text-align:center;font-variant-numeric:tabular-nums}
.topic .tbody{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.topic .t-ru{font-family:var(--serif);font-weight:700;font-size:1.375rem;line-height:1.2}
.topic .t-pl{color:var(--muted);font-size:1rem;line-height:1.35}
.topic .t-stats{color:var(--muted);font-size:.875rem;margin-top:var(--s1);font-variant-numeric:tabular-nums}
.topic .chev{color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:var(--s5) var(--s3);border:1.5px dashed var(--line);border-radius:16px}
.empty b{display:block;color:var(--ink);font-size:1.125rem;margin-bottom:var(--s1)}

/* ---------- Pasek u góry ---------- */
.appbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.appbar-in{display:flex;align-items:center;gap:var(--s2);min-height:var(--bar-h);max-width:72rem;margin:0 auto;padding-left:max(var(--s2),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.backbtn{display:inline-flex;align-items:center;gap:2px;min-height:var(--tap);padding:0 var(--s2) 0 4px;border:0;background:none;color:var(--accent);font-size:1.0625rem;cursor:pointer;border-radius:var(--radius);flex:0 0 auto}
.backbtn:active{background:var(--accent-soft)}
.appbar-title{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.2;text-align:right}
.appbar-title b{font-size:1.0625rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar-title span{font-size:.875rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Nawigacja sekcji: na dole (telefon) / z lewej (tablet poziomo) ---------- */
.tabnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabnav .tabs{display:flex;width:100%;max-width:40rem}
.tab{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--nav-h);padding:6px 2px;border:0;background:none;color:var(--muted);font-size:.875rem;cursor:pointer;position:relative}
.tab .pill{display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:999px;transition:background .15s}
.tab span.lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.tab[aria-current="page"] .pill{background:var(--accent-soft)}
.tab:active .pill{background:var(--accent-soft)}
.content{padding-bottom:calc(var(--nav-h) + var(--s5) + env(safe-area-inset-bottom,0px))}

@media (min-width:900px){
  .screen.scr-topic{padding-left:104px}
  .tabnav{top:0;right:auto;width:104px;flex-direction:column;justify-content:center;border-top:0;border-right:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
  .tabnav .tabs{flex-direction:column;gap:var(--s2);padding:var(--s3) 0}
  .tab{flex:0 0 auto;min-height:72px}
  .appbar{margin-left:0}
  .content{padding-bottom:calc(var(--s6) + env(safe-area-inset-bottom,0px))}
  .content .wrap{max-width:58rem}
}

/* ---------- Sekcja ---------- */
.section{display:flex;flex-direction:column;gap:var(--s4);padding-top:var(--s4)}
.sechead{display:flex;align-items:center;gap:var(--s2);min-height:var(--tap)}
.sechead h2{font-family:var(--serif);font-weight:700;font-size:1.75rem;flex:1;min-width:0}
.block{display:flex;flex-direction:column;gap:var(--s3)}
.label{font-size:.875rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.note{font-size:1rem;color:var(--muted)}
.info{display:flex;gap:var(--s2);align-items:flex-start;font-size:1rem;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:12px var(--s3)}
.info .ic{color:var(--muted);margin-top:1px}

/* Wyszukiwarka */
.search{position:relative}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;min-height:52px;padding:0 48px 0 48px;border-radius:var(--radius);border:1.5px solid var(--line);background:var(--surface);font-size:1.125rem;-webkit-appearance:none;appearance:none}
.search input:focus{border-color:var(--accent);outline:none}
.search input::placeholder{color:var(--faint)}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:var(--tap);height:var(--tap);display:flex;align-items:center;justify-content:center;border:0;background:none;color:var(--accent);cursor:pointer;border-radius:var(--radius)}
mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 1px}

/* Listy słówek – pogrupowane, rosyjski ważniejszy od polskiego */
.group{display:flex;flex-direction:column}
.group h3{font-size:1.25rem;font-weight:700;margin:var(--s2) 0 var(--s2)}
.group h4{position:sticky;top:calc(var(--bar-h) + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);font-size:.875rem;font-weight:700;color:var(--muted);letter-spacing:.02em;padding:var(--s2) 0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.wrow{display:flex;align-items:center;gap:var(--s2);width:100%;min-height:56px;border-top:1px solid var(--line)}
.wmain{flex:1;min-width:0;display:grid;grid-template-columns:1fr;gap:2px;text-align:left;padding:12px 0 12px var(--s3);border:0;background:none;color:inherit;font:inherit}
.wrow>.wmain:last-child{padding-right:var(--s3)}
.wrow:first-child{border-top:0}
button.wmain{cursor:pointer;min-height:56px}
button.wmain:active{background:var(--accent-soft)}
.wrow .ru{font-size:1.25rem;line-height:1.3;min-width:0}
.wrow .pl{font-size:1rem;color:var(--muted);line-height:1.35;min-width:0}
.wrow .veil{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:.9375rem}
.wrow .veil{border:1.5px dashed var(--accent);border-radius:8px;padding:2px 10px;font-weight:600}
@media (min-width:640px){.wmain{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:var(--s3);align-items:baseline}}
.count{font-size:.9375rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* Teksty */
.textcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:var(--s4) var(--s3);display:flex;flex-direction:column;gap:var(--s3)}
.textcard h3{font-family:var(--serif);font-size:1.375rem}
.bil{display:grid;gap:var(--s4)}
.bil .ru,.bil .pl{white-space:pre-line}
.bil .ru{font-size:1.25rem;line-height:1.65;max-width:38em}
.bil .pl{font-size:1.125rem;line-height:1.6;color:var(--ink);border-left:3px solid var(--line);padding-left:var(--s3);max-width:38em}
@media (min-width:900px){.bil.two{grid-template-columns:1fr 1fr}.bil.two .pl{border-left:0;padding-left:0;border-top:0}}
.tsw{display:flex;flex-wrap:wrap;column-gap:var(--s4)}
.bil .hid{display:flex;gap:12px;align-items:flex-start;color:var(--muted);font-size:1rem;line-height:1.5;padding:var(--s3);border:1px dashed var(--line);border-radius:12px}
.bil .hid[hidden],.bil [hidden]{display:none}
.player{display:flex;align-items:center;gap:var(--s2);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:var(--s2)}
.pbtn{flex:none;width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent,#fff);display:grid;place-items:center;cursor:pointer}
.pbtn .ic{width:24px;height:24px}
.pb2{flex:none;min-width:var(--tap);height:var(--tap);border-radius:12px;border:0;background:none;color:var(--ink);display:grid;place-items:center;cursor:pointer;font:600 .9375rem var(--sans);font-variant-numeric:tabular-nums}
.pmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.prow{display:flex;justify-content:space-between;font-size:.8125rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pseek{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer;--p:0%}
.pseek::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--p),var(--line) var(--p))}
.pseek::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);margin-top:-7px;border:3px solid var(--surface)}
.pseek::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--p),var(--line) var(--p))}
.pseek::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--surface)}
.switch{display:flex;align-items:center;gap:12px;min-height:var(--tap);padding:0;border:0;background:none;color:var(--ink);font-size:1rem;cursor:pointer;text-align:left}
.switch .tr{width:52px;height:32px;border-radius:999px;background:var(--faint);position:relative;flex:0 0 auto;transition:background .15s}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s}
.switch[aria-checked="true"] .tr{background:var(--accent)}
.switch[aria-checked="true"] .tr::after{transform:translateX(20px)}

/* Odmiana – karty zamiast szerokiej tabeli (bez przewijania w bok) */
.verbs{display:grid;gap:var(--s3)}
@media (min-width:640px){.verbs{grid-template-columns:repeat(auto-fill,minmax(min(100%,19rem),1fr))}}
.verb{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:var(--s3);display:flex;flex-direction:column;gap:12px}
.verb header{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap}
.verb header b{font-family:var(--serif);font-size:1.5rem}
.verb header span{color:var(--muted);font-size:1rem}
.verb .tag{font-size:.8125rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,8em),1fr));gap:var(--s3)}
.forms>div{min-width:0}
.forms h5{margin:0 0 4px;font-size:.875rem;color:var(--muted);font-weight:700}
.forms ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.forms li{display:flex;gap:var(--s2);font-size:1.125rem;line-height:1.45}
.forms li i{font-style:normal;color:var(--faint);font-size:.875rem;width:2.6em;flex:0 0 auto;padding-top:3px}
.forms .st{color:var(--muted)}
.forms .en{font-weight:700}

/* Ćwiczenia */
.progress{display:flex;flex-direction:column;gap:var(--s2)}
.progress .row{justify-content:space-between}
.pbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:4px;width:0;transition:width .3s}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:var(--s3);display:flex;flex-direction:column;gap:12px}
.ex .q{font-size:1.25rem;line-height:1.45}
.ex .q .n{color:var(--muted);font-size:1rem;margin-right:6px;font-variant-numeric:tabular-nums}
.ex input{width:100%;min-height:52px;padding:0 var(--s3);border-radius:var(--radius);border:1.5px solid var(--line);background:var(--surface-2);font-size:1.25rem}
.ex input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.ex .acts{display:flex;gap:var(--s2);flex-wrap:wrap}
.ex .acts .btn{flex:1 1 9rem}
.ex.ok{border-color:var(--ok)} .ex.ok input{border-color:var(--ok);background:var(--ok-soft)}

/* ---------- Fiszki ---------- */

.card{position:relative;width:100%;min-height:17rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s3);padding:var(--s5) var(--s4);border-radius:20px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);text-align:center;cursor:pointer;-webkit-user-select:none;user-select:none}

.card .tagline{position:absolute;top:var(--s3);left:var(--s3);right:var(--s3);display:flex;justify-content:center;pointer-events:none}
.card .tagline span{display:inline-flex;align-items:center;max-width:100%;font-size:.875rem;font-weight:700;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* obracana karta */
.card.flipcard{padding:0;background:none;border:0;box-shadow:none;display:block;perspective:1200px}

/* ---------- Pełny ekran fiszek ---------- */
#full{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:12px;
  padding:max(12px,env(safe-area-inset-top,0px)) max(var(--gutter),env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(var(--gutter),env(safe-area-inset-left,0px));
  overflow:hidden;touch-action:none;animation:fadein .18s ease-out}

.duehome>div{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.duebtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 6px 0 14px;border-radius:999px;border:1.5px solid var(--accent);background:var(--surface);color:var(--ink);cursor:pointer;font-size:.9375rem}
.duebtn b{font-family:var(--serif)}.duebtn span{min-width:28px;height:28px;padding:0 8px;border-radius:999px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:.875rem}
.streak{margin:var(--s2) 0 0;text-align:center;font-size:.875rem;color:var(--muted)}
.h3below{display:flex;flex-direction:column;align-items:center}
:root{--line-strong:#8C95A6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--line-strong:#5D6779}}
:root[data-theme="dark"]{--line-strong:#5D6779}
.ex input,.search input,.wpl,.bktxt,.fquiz input{border-color:var(--line-strong)}
::placeholder{color:var(--faint);opacity:1}
.b-group{box-shadow:inset 0 0 0 1.5px var(--accent)}
.b-group small{opacity:1}
.ans{display:inline-block;font-family:var(--serif);font-size:1.25rem;font-weight:700;color:var(--ink);background:var(--surface);border-radius:6px;padding:0 6px;margin-top:2px}
.ex.ok .btn.primary{opacity:.55}
.btn.text{background:transparent;border-color:transparent;color:var(--accent)}
#toast{top:auto;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px)}
body.nonav #toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
body.fs #toast{top:auto;bottom:calc(140px + env(safe-area-inset-bottom,0px))}
body.kbdon #toast{bottom:calc(var(--kbh,260px) + 12px)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 calc(-1*var(--gutter));padding-inline:var(--gutter);scroll-padding-inline:var(--gutter)}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none;white-space:nowrap}
.wfil{display:flex;flex-direction:column;gap:var(--s3)}
.tsize button span{font-family:var(--serif);font-weight:700;line-height:1}
.seg button{overflow-wrap:normal;word-break:normal;hyphens:none}
.fquiz{display:flex;flex-direction:column;gap:var(--s2)}
.fquiz input{width:100%;min-height:52px;padding:0 var(--s3);border-radius:var(--radius);border:1.5px solid var(--line-strong);background:var(--surface-2);font-size:1.25rem;color:var(--ink)}
.fquiz .acts{display:flex;justify-content:flex-end;gap:var(--s2)}
.fsbig{width:100%;min-height:52px}
#full.ended .judge{display:none}
#full .card.done .btn{min-height:48px}
.rukbd{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--surface-2);border-top:1px solid var(--line-strong);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;user-select:none;-webkit-user-select:none;touch-action:manipulation;box-shadow:0 -8px 24px -12px rgba(0,0,0,.35)}
.rukbd[hidden]{display:none}
.rukbd .kr{display:flex;gap:4px;justify-content:center}
.rukbd .kk{position:relative;flex:1 1 0;max-width:3rem;min-width:0;height:48px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:1.3rem;font-family:var(--sans);display:grid;place-items:center;padding:0;cursor:pointer}
.rukbd .kk sup{position:absolute;top:2px;right:4px;font-size:.6rem;color:var(--muted)}
.rukbd .kk.down{background:var(--accent-soft)}
.rukbd .kk.down:not(.kw):not(.kspace)::after{content:attr(data-c);position:absolute;bottom:52px;left:50%;transform:translateX(-50%);min-width:44px;height:56px;border-radius:10px;background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--shadow);display:grid;place-items:center;font-size:1.8rem;color:var(--ink)}
.rukbd .kw{flex:1.4 1 0;max-width:4.2rem;font-size:1.1rem}
.rukbd .kspace{flex:5 1 0;max-width:none;font-size:.9rem;color:var(--muted)}
.rukbd .kok{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.rukbd .ksys .ic{width:22px;height:22px}
body.kbdon .content,body.kbdon main{padding-bottom:calc(var(--kbh,260px) + 24px)}
body.kbdon .tabnav{display:none}
@media (orientation:landscape) and (max-height:520px){.card{min-height:11rem}.rukbd .kk{height:38px}}
.say,.seg button,.pseek,.mini .mbtn{min-height:48px;min-width:48px}
.say{width:48px;height:48px}

:root{--tonal:#1E2533;--on-tonal:#F3F5F8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tonal:#2B3548;--on-tonal:#E9ECF1}}
:root[data-theme="dark"]{--tonal:#2B3548;--on-tonal:#E9ECF1}
.b-tool,.mini{background:var(--tonal);color:var(--on-tonal)}
.switch[aria-checked="true"] .tr::after{background:var(--on-accent)}
#toast{background:var(--tonal);color:var(--on-tonal)}

.trow{display:flex;justify-content:center;gap:var(--s2);flex-wrap:wrap}
.tskip.next{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.ttarget.reveal span{color:var(--ink)}
.ttarget.masked .hide{margin:0 2px;display:inline-block}
@media (max-width:400px){.ttrb span{display:none}}
#tstartset{margin-left:auto;flex:none}
@media (orientation:landscape) and (max-height:520px){
  #trun.withkbd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-auto-rows:min-content;column-gap:16px;overflow:auto}
  #trun.withkbd>*{grid-column:1}
  #trun.withkbd>.tbar{grid-column:1/3}
  #trun.withkbd>.tkbd{grid-column:2;grid-row:2/span 6;align-self:end;margin:0!important;max-width:none!important}
  #trun.withkbd .tkbd .k{height:40px}
  #trun.withkbd .tstage{min-height:0}
}
.thint b{font-family:var(--serif);font-size:1.15em}

.totop{position:fixed;right:16px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:25;width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--accent);display:grid;place-items:center;box-shadow:var(--shadow);cursor:pointer}
.totop[hidden]{display:none}.totop .ic{transform:rotate(90deg)}
.forms li.sayable{cursor:pointer;border-radius:6px}.forms li.sayable:active{background:var(--accent-soft)}
@media (min-width:900px){.totop{bottom:24px}}

/* pasek u góry w stylu Androida: strzałka ← i tytuł po lewej */
.backbtn{width:48px;height:48px;padding:0;justify-content:center;border-radius:50%;color:var(--ink)}
